[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pydiskinfo"
version = "1.0.0"
description = "Zero-dependency, cross-platform disk inspection & hardware volume UUID reader (Windows, Linux, macOS)."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [
    { name = "Viliam Schneider" }
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Hardware",
    "Topic :: System :: Systems Administration",
]

dependencies = []

[tool.setuptools]
# Automaticky nájde priečinky/balíčky s Python kódom
packages = { find = {} }